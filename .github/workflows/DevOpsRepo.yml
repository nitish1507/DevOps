name: Terraform Dev

on:
  push:
    branches:
      - main
      - feature

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: [self-hosted, windows, x64]

    defaults:
      run:
        working-directory: ./environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure Account
        shell: powershell
        run: |
          az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform Version
        shell: powershell
        run: |
          terraform version

      - name: Check Terraform Files
        shell: powershell
        run: |
          Write-Host "Current Directory:"
          Get-Location

          Write-Host "`nTerraform Files:"
          Get-ChildItem -Filter *.tf

      - name: Terraform Init
        shell: powershell
        run: |
          terraform init

      - name: Terraform Validate
        shell: powershell
        run: |
          terraform validate

      - name: Terraform Plan
        shell: powershell
        run: |
          terraform plan -no-color

      - name: Terraform Apply
        shell: powershell
        run: |
          terraform apply -auto-approve -no-color
