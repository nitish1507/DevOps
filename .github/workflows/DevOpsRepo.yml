name: Terraform Dev

on:
  push:
    branches:
      - main
      - feature

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: [self-hosted, windows, x64]

    defaults:
      run:
        working-directory: ./environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure Account
        shell: powershell
        run: |
          Write-Host "=== AZURE ACCOUNT ==="
          az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform
        shell: powershell
        run: |
          Write-Host "=== TERRAFORM VERSION ==="
          terraform version

      - name: Check Working Directory
        shell: powershell
        run: |
          Write-Host "=== CURRENT DIRECTORY ==="
          Get-Location

          Write-Host "=== TERRAFORM FILES ==="
          Get-ChildItem -Filter *.tf

      - name: Terraform Init
        shell: powershell
        run: |
          Write-Host "=== TERRAFORM INIT ==="
          terraform init

      - name: Terraform Validate
        shell: powershell
        run: |
          Write-Host "=== TERRAFORM VALIDATE ==="
          terraform validate

      - name: Terraform Plan
        shell: powershell
        run: |
          Write-Host "=== TERRAFORM PLAN START ==="
          terraform plan -no-color
          Write-Host "=== TERRAFORM PLAN END ==="

      # Apply temporarily disabled
      # - name: Terraform Apply
      #   shell: powershell
      #   run: |
      #     Write-Host "=== TERRAFORM APPLY ==="
      #     terraform apply -auto-approve -no-color
